# The unit MM actually operates. Built from this checkout -- there is no registry and no
# published image, so a fix is `git pull && docker compose up -d --build`.

services:
  bday:
    build: .
    image: bday-games:local
    container_name: bday
    restart: unless-stopped

    # Read from a .env file beside this one. Copy .env.example and fill it in.
    env_file:
      - .env

    ports:
      # Host port 3040 -> container. Defaults to loopback so the reverse proxy terminating TLS
      # for bday.moeriki.com is what's reachable, not this.
      #
      # ON TOWER, BIND_ADDR IS REQUIRED -- the default below will always 502. Set it in .env,
      # not here:
      #
      #   BIND_ADDR=192.168.129.201     # or 0.0.0.0 if the LAN is trusted
      #
      # Nginx Proxy Manager runs as a macvlan container on br0 (192.168.128.0/23), so it is a
      # separate network namespace and can never reach this host's 127.0.0.1. Its own address
      # 192.168.128.2 is in that same /23 as the host's 192.168.129.201 -- the subnets were
      # never the issue, the namespace is. Verified 4 Aug from inside the NPM container:
      # 192.168.129.201:9000 answered 302 while 127.0.0.1:9000 answered nothing.
      #
      # Only bday.moeriki.com should be proxied. Do not expose HA's /api/webhook/ through it.
      - '${BIND_ADDR:-127.0.0.1}:3040:3040'

    volumes:
      # THE DIRECTORY, never the .sqlite file. Bind-mounting the file alone breaks WAL, and it
      # breaks silently. See docs/adr/sqlite-via-node-sqlite.md.
      - ./data:/data

    # Home Assistant is NOT a Docker container here -- it is HAOS in a QEMU VM at
    # 192.168.129.36, confirmed by MM. So there is no shared Docker network and no service
    # name to use: HA_WEBHOOK_URL takes the VM's LAN IP directly.
    #
    #   HA_WEBHOOK_URL=http://192.168.129.36:8123/api/webhook/<WEBHOOK_ID>
    #
    # Docker NAT rewrites this container's source address to the host's LAN IP
    # (192.168.129.201), which is RFC1918, so HA's local_only: true accepts it.
